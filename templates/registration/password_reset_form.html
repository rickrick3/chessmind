{% extends "base.html" %}{% load i18n %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <h1 class="h3 mt-4">{% trans "Reset your password" %}</h1>
  <p class="text-secondary">{% trans "Type your email. We'll send you a link to choose a new password." %}</p>
  <form method="post">{% csrf_token %}
    <input class="form-control form-control-lg mb-2" type="email" name="email" autocomplete="email" required placeholder="{% trans 'Email' %}">
    <button class="btn btn-primary btn-lg w-100">{% trans "Send the link" %}</button>
  </form>
</div></div>
{% endblock %}
