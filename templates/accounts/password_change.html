{% extends "base.html" %}{% load i18n %}
{% block title %}{% trans "Change my password" %} · ChessMind{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <h1 class="h3 mt-4">{% trans "Change my password" %}</h1>
  <form method="post">{% csrf_token %}
    {% for field in form %}
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      <input class="form-control mb-2" type="password" id="{{ field.id_for_label }}" name="{{ field.html_name }}" required>
      {% for e in field.errors %}<div class="text-danger small mb-2">{{ e }}</div>{% endfor %}
    {% endfor %}
    <button class="btn btn-primary w-100">{% trans "Save the password" %}</button>
  </form>
</div></div>
{% endblock %}
