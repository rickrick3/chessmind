services:
  db:
    image: postgres:16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    command: sh -c "python manage.py migrate && gunicorn config.wsgi -b 0.0.0.0:8000 -w 2"
    ports: ["8000:8000"]
    depends_on: [db, redis]
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: celery -A config worker -B -Q celery,content -c 2 -l info
    depends_on: [db, redis]
    restart: unless-stopped
  test:
    build: .
    profiles: ["test"]
    env_file: .env
    volumes: [".:/app"]
    depends_on: [db, redis]
    command: pytest
  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    profiles: ["e2e"]
    env_file: .env
    environment:
      DJANGO_ALLOW_ASYNC_UNSAFE: "true"
    volumes: [".:/app"]
    depends_on: [db, redis]
    command: pytest e2e -v -p no:cacheprovider
volumes:
  pgdata:
